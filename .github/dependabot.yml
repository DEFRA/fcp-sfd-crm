version: 2

updates:
- package-ecosystem: docker-compose
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
  open-pull-requests-limit: 5
  ignore:
  # mongo is pinned to 7.0.x. MongoDB 8.0+ will not start on Linux kernel 6.19
  # to 7.0.13; see compose.yaml.
  - dependency-name: mongo
    versions: [">= 8.0.0"]
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
  ignore:
  # global-agent is pinned to 3.0.0. Version 4.x breaks TLS hostname checks on
  # outbound HTTPS through the CDP proxy; see .snyk.
  - dependency-name: global-agent
  groups:
    npm-production:
      applies-to: version-updates
      dependency-type: production
      patterns:
      - "*"
    vitest:
      applies-to: version-updates
      patterns:
      - "vitest"
      - "@vitest/*"
    linting:
      applies-to: version-updates
      patterns:
      - "eslint"
      - "eslint-*"
      - "neostandard"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
