name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci

      # global-agent 4.x breaks outbound HTTPS through the CDP proxy; see .snyk
      - name: Check global-agent Pin
        env:
          GLOBAL_AGENT_VERSION: 3.0.0
        run: |
          node -e '
            const expected = process.env.GLOBAL_AGENT_VERSION
            const declared = require("./package.json").dependencies["global-agent"]
            const installed = require("global-agent/package.json").version
            if (declared !== expected || installed !== expected) {
              console.error(`global-agent must be ${expected} (package.json: ${declared}, installed: ${installed})`)
              process.exit(1)
            }
          '

      # MongoDB 8.0+ will not start on the runner's Linux kernel; see compose.yaml
      - name: Check MongoDB Image Pin
        env:
          MONGO_IMAGE: mongo:7.0.45
        run: |
          declared=$(docker compose -f compose.yaml -f compose.test.yaml config --images | grep '^mongo:')
          if [ "$declared" != "$MONGO_IMAGE" ]; then
            echo "MongoDB image must be $MONGO_IMAGE (compose: $declared)" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build Docker Image
        run: |
          set +e
          docker build --no-cache --tag fcp-sfd-crm .
          exit $?

      - name: Run Tests
        run: |
          mkdir -p coverage
          chmod -R a+rw ./coverage
          docker compose -f compose.yaml -f compose.test.yaml run --rm "fcp-sfd-crm"

      - name: SonarQube Cloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_SCANNER_OPTS: "-Dsonar.verbose=true"

      - name: Snyk Scan
        if: github.actor != 'dependabot[bot]'
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium
